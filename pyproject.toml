[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hypertensive-crisis-engine"
version = "2.0.0"
description = "HypertensiveCrisis Sentinel: Emergency vs Urgency End-Organ Damage Arbiter"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hypertensive-crisis-engine = "hypertensive_crisis_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/hypertensive-crisis-engine"
Repository = "https://github.com/abusuraihsakhri/hypertensive-crisis-engine.git"
